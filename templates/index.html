<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Light Tracker - Toronto</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style> 
        body {
            padding: 0px;
            margin: 0px;
            width: 100vw;
            height: 100vh;
            background: rgb(30, 30, 30);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
    
        #status-container {
            text-align: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: white;
            margin-top: 20px;
        }
    
        #intersection-name {
            font-size: 24px;
            font-weight: 600;
            max-width: 90vw;
            text-align: center;
        }
    
        #distance-text {
            font-size: 14px;
            color: #aaa;
            margin-top: 5px;
        }
        
        #map {
            width: 90%;
            max-width: 400px;
            height: 250px;
            border-radius: 15px;
            border: 1px solid rgb(110, 110, 110);
            z-index: 1; 
        }

        .leaflet-layer,
        .leaflet-control-zoom-in,
        .leaflet-control-zoom-out,
        .leaflet-control-attribution {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
    
        #full-light {
            background: rgb(49, 49, 49);
            border: 1px solid rgb(110, 110, 110);
            width: fit-content;
            height: fit-content;
            padding: 25px 15px;
            border-radius: 15px;
            gap: 5px;
            display: flex;
            flex-direction: column;
        }
    
        .circle {
            width: 35px;
            height: 35px;
            border: 1px solid rgb(30, 30, 30);
            border-radius: 100px;
            transition: opacity 0.2s ease;
        }
    
        .green { background: rgb(66, 212, 46); opacity: 0.2; }
        .amber { background: rgb(219, 193, 26); opacity: 0.2; }
        .red   { background: rgb(219, 26, 26); opacity: 0.2; }
    
        .active {
            opacity: 1;
            box-shadow: 0 0 15px currentColor;
        }
    
        #timing, .text {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: white;
            font-size: 25px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <div id="status-container">
        <div id="intersection-name">Loading Intersections...</div>
        <div id="distance-text">Waiting for GPS</div>
    </div>

    <div id="map"></div>

    <div id="full-light">    
        <div id="light-green" class="circle green"></div>
        <div id="light-amber" class="circle amber"></div>
        <div id="light-red" class="circle red"></div>
    </div>
    
    <div style="display: flex;">
        <div id="timing">--</div><span class="text">s</span>
    </div>
    
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const timer = document.getElementById("timing");
        const greenLight = document.getElementById("light-green");
        const amberLight = document.getElementById("light-amber");
        const redLight = document.getElementById("light-red");
        const intersectionName = document.getElementById("intersection-name");
        const distanceText = document.getElementById("distance-text");

        let intersections = [];
        let activeIntersection = null;

        let map = L.map('map').setView([43.6532, -79.3832], 12); // Default to Toronto
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let userMarker, intersectionMarker;

        // Custom CSV parser handling quotes in names
        function parseCSV(csvContent) {
            const rows = csvContent.trim().split(/\r?\n/);
            const headers = rows[0].split(',').map(h => h.trim());
            const data = [];
            
            for(let i = 1; i < rows.length; i++) {
                // Handle potential commas inside quoted street names
                const values = rows[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || rows[i].split(',');
                
                if (values.length < 4) continue;
                
                const obj = {};
                headers.forEach((header, index) => {
                    if (values[index]) {
                        obj[header] = values[index].replace(/^"|"$/g, '').trim();
                    }
                });
                data.push(obj);
            }
            return data;
        }

        fetch('traffic-signals-combined.csv')
            .then(response => response.text())
            .then(csvContent => {
                const data = parseCSV(csvContent);
                
                // Deduplicate by TCS ID and assign mock cycle timings
                const uniqueIntersections = new Map();
                data.forEach(row => {
                    if (!uniqueIntersections.has(row.TCS)) {
                        uniqueIntersections.set(row.TCS, {
                            id: row.TCS,
                            name: row.name || "Unknown Intersection",
                            lat: parseFloat(row.lat),
                            lon: parseFloat(row.lon),
                            cycleLength: 90,       // Mocked 90s cycle
                            greenDuration: 40,     // 40s green
                            yellowDuration: 5,     // 5s amber
                            syncOffset: (parseInt(row.TCS) * 13) % 90 // Randomize start times slightly based on ID
                        });
                    }
                });
                
                intersections = Array.from(uniqueIntersections.values());
                intersectionName.innerText = "Ready. Searching for nearest light...";
            })
            .catch(error => {
                console.error('Error fetching CSV:', error);
                intersectionName.innerText = "Error loading data.";
            });

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const p1 = lat1 * Math.PI/180;
            const p2 = lat2 * Math.PI/180;
            const dp = (lat2-lat1) * Math.PI/180;
            const dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dp/2) * Math.sin(dp/2) +
                      Math.cos(p1) * Math.cos(p2) *
                      Math.sin(dl/2) * Math.sin(dl/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
        }

        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition((position) => {
                const userLat = position.coords.latitude;
                const userLon = position.coords.longitude;
                // const userLat = 43.598576;
                // const userLon = -79.517121;

                
                // const userLat = 43.600060;
                // const userLon = -79.517771;
                
                if (!userMarker) {
                    userMarker = L.marker([userLat, userLon]).addTo(map);
                    userMarker.bindPopup("You").openPopup();
                    map.setView([userLat, userLon], 16); 
                } else {
                    userMarker.setLatLng([userLat, userLon]);
                    map.setView([userLat, userLon]); 
                }

                if (intersections.length === 0) return;

                let closest = null;
                let minDistance = 300;

                intersections.forEach(intersection => {
                    const dist = getDistance(userLat, userLon, intersection.lat, intersection.lon);
                    if (dist < minDistance) {
                        minDistance = dist;
                        closest = intersection;
                    }
                });
                
                if (closest) {
                    activeIntersection = closest;
                    intersectionName.innerText = activeIntersection.name;
                    distanceText.innerText = `${Math.round(minDistance)} meters away`;

                    if (!intersectionMarker) {
                        intersectionMarker = L.circleMarker([closest.lat, closest.lon], {
                            color: 'red', fillColor: '#f03', fillOpacity: 0.5, radius: 12
                        }).addTo(map);
                    } else {
                        intersectionMarker.setLatLng([closest.lat, closest.lon]);
                    }
                } else {
                    activeIntersection = null;
                    intersectionName.innerText = "Out of Range";
                    distanceText.innerText = "No known lights nearby";
                    resetLights();
                    
                    if (intersectionMarker) {
                        map.removeLayer(intersectionMarker);
                        intersectionMarker = null;
                    }
                }
            }, (error) => {
                console.error("GPS Error:", error);
                distanceText.innerText = "Please enable GPS";
            }, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 });
        }

        setInterval(() => {
            if (!activeIntersection) return;

            const now = Math.floor(Date.now() / 1000); 
            const timeInCycle = (now + activeIntersection.syncOffset) % activeIntersection.cycleLength;
            
            let color = "";
            let timeRemaining = 0;

            if (timeInCycle < activeIntersection.greenDuration) {
                color = "green";
                timeRemaining = activeIntersection.greenDuration - timeInCycle;
            } else if (timeInCycle < (activeIntersection.greenDuration + activeIntersection.yellowDuration)) {
                color = "amber";
                timeRemaining = (activeIntersection.greenDuration + activeIntersection.yellowDuration) - timeInCycle;
            } else {
                color = "red";
                timeRemaining = activeIntersection.cycleLength - timeInCycle;
            }

            updateLights(color);
            timer.innerText = timeRemaining;

        }, 200);

        function updateLights(color) {
            greenLight.classList.remove('active');
            amberLight.classList.remove('active');
            redLight.classList.remove('active');
            greenLight.style.color = "";
            amberLight.style.color = "";
            redLight.style.color = "";

            if (color === "green") {
                greenLight.classList.add('active');
                greenLight.style.color = "rgb(66, 212, 46)"; 
            }
            if (color === "amber") {
                amberLight.classList.add('active');
                amberLight.style.color = "rgb(219, 193, 26)";
            }
            if (color === "red") {
                redLight.classList.add('active');
                redLight.style.color = "rgb(219, 26, 26)";
            }
        }

        function resetLights() {
            greenLight.classList.remove('active');
            amberLight.classList.remove('active');
            redLight.classList.remove('active');
            timer.innerText = "--";
        }
    </script>
</body>
</html>
