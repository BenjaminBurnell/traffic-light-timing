<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="full-light">    
        <div class="circle green active"></div>
        <div class="circle amber"></div>
        <div class="circle red"></div>
    </div>
    <div style="display: flex;"><div id="timing">10</div><span class="text">s</span></div>
    
    <!-- Functions -->
    <script>
        // Convert CSV string to array of objects
        function csvToJson(csvContent) {
            const rows = csvContent.trim().split(/\r?\n/);
            const headers = rows.shift().split(',');
            return rows.map(row => {
                const values = row.split(',');
                return headers.reduce((obj, header, i) => {
                    obj[header] = values[i];
                    return obj;
                }, {});
            });
        }
    </script>

    <!-- Main -->
    <script defer  type="module">
        const currentTime = new Date().getTime()
        const timer = document.getElementById("timing");

        setInterval(function() {
            timer.innerText = Number(timer.innerText) - 1
        }, 1000)

        fetch('traffic-signals-timing.csv')
            .then(response => response.text())
            .then(csvContent => {
                const data = csvToJson(csvContent); // Use the same csvToJson function
                console.log(data);
            })
            .catch(error => console.error('Error fetching CSV:', error));


        console.log(currentTime)
    </script>
</body>
<style> 
    body {
        padding:0px;
        margin:0px;
        width:100vw;
        height:100vh;
        background:rgb(30, 30, 30);
        display:flex;
        flex-direction: column;
        justify-content:center;
        align-items:center;
        gap: 15px;
    }

    #full-light {
        background:rgb(49, 49, 49);
        border:1px solid rgb(110, 110, 110);
        width:fit-content;
        height:fit-content;
        padding:25px 15px;
        border-radius:15px;
        gap:5px;
        display:flex;
        flex-direction: column;
    }

    .circle {
        width:35px;
        height:35px;
        border: 1px solid rgb(30, 30, 30);
        border-radius: 100px;
    }

    .green {
        background:rgb(66, 212, 46);
        opacity: .5;
    }

    .amber {
        background:rgb(219, 193, 26);
        opacity: .5;
    }

    .red {
        background:rgb(219, 26, 26);
        opacity: .5;
    }

    .active {
        opacity: 1;
    }

    #timing, .text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        color: white;
        font-size: 25px;
        font-weight: 600;
    }
</style>
</html>
